---
name: Configuration

on:
  workflow_call:
    outputs:
      versions:
        description: JSON array of supported release tags
        value: ${{ jobs.config.outputs.versions }}
      platforms:
        description: JSON array of supported platforms
        value: ${{ jobs.config.outputs.platforms }}
      latest_version:
        description: Version carrying the latest tag
        value: ${{ jobs.config.outputs.latest_version }}

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.values.outputs.versions }}
      platforms: ${{ steps.values.outputs.platforms }}
      latest_version: ${{ steps.values.outputs.latest_version }}
    steps:
      - id: values
        run: |
          {
            echo 'versions=["3.21.0","3.21.1","3.21.2","3.21.3","3.21.4","3.21.5","3.21.6","3.21.7","3.21.8","3.21.9","3.22.0","3.22.1","3.22.2","3.22.3","3.22.4","3.23.0","3.23.2","3.23.3","3.23.4"]'
            echo 'platforms=["linux/386","linux/amd64","linux/arm/v6","linux/arm/v7","linux/arm64/v8","linux/ppc64le","linux/s390x"]'
            echo 'latest_version=3.23.4'
          } >> "$GITHUB_OUTPUT"
